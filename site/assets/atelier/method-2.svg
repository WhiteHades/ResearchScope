<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 816" width="816" height="816" role="img" aria-label="Discover">
  
  <defs>
    <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.082  0 0 0 0 0.078  0 0 0 0 0.059  0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="atelier-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#15140f" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- paper base -->
  <rect width="816" height="816" fill="#efe7d2"/>
  <rect width="816" height="816" fill="url(#atelier-grid)"/>
  <rect width="816" height="816" filter="url(#paper-noise)" opacity="0.6"/>
  <!-- corner brackets -->
  <g stroke="#8b8676" stroke-width="1.4" fill="none">
    <path d="M37 82 L37 37 L82 37"/>
    <path d="M734 37 L779 37 L779 82"/>
    <path d="M37 734 L37 779 L82 779"/>
    <path d="M734 779 L779 779 L779 734"/>
  </g>
  <!-- motif -->
  <g transform="translate(408 390.9)">
         <circle r="130.56" fill="none" stroke="#15140f" stroke-opacity="0.28"/>
         <ellipse rx="163.20000000000002" ry="57.120000000000005" fill="none" stroke="#15140f" stroke-opacity="0.4" transform="rotate(-22)"/>
         <circle cx="146.88" cy="-32.64" r="20.400000000000002" fill="#ed6f5c"/>
       </g>
  <!-- title -->
  <text x="408" y="505.92" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif" font-style="italic"
        font-weight="500" font-size="57" fill="#15140f" letter-spacing="-0.5">
    Discover<tspan fill="#ed6f5c">.</tspan>
  </text>
  <!-- meta: slot id -->
  <text x="408" y="587.52" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="20" fill="#8b8676" letter-spacing="2">
    METHOD-2 · 816×816
  </text>
  <!-- hint: research prompt -->
  <text x="408" y="636.48" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#8b8676" letter-spacing="0.6">
