<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Recommender">
  
  <defs>
    <filter id="paper-noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.082  0 0 0 0 0.078  0 0 0 0 0.059  0 0 0 0.06 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <pattern id="grid-zytn0" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#15140f" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <!-- paper base -->
  <rect width="1280" height="720" fill="#efe7d2"/>
  <rect width="1280" height="720" fill="url(#grid-a)"/>
  <rect width="1280" height="720" filter="url(#paper-noise)" opacity="0.6"/>
  <!-- corner brackets -->
  <g stroke="#8b8676" stroke-width="1.4" fill="none">
    <path d="M32 72 L32 32 L72 32"/>
    <path d="M1208 32 L1248 32 L1248 72"/>
    <path d="M32 648 L32 688 L72 688"/>
    <path d="M1208 688 L1248 688 L1248 648"/>
  </g>
  <!-- motif -->
  <g transform="translate(640 345)">
         <circle r="115.2" fill="none" stroke="#15140f" stroke-opacity="0.28"/>
         <ellipse rx="144" ry="50.400000000000006" fill="none" stroke="#15140f" stroke-opacity="0.4" transform="rotate(-22)"/>
         <circle cx="129.6" cy="-28.8" r="18" fill="#ed6f5c"/>
       </g>
  <!-- title -->
  <text x="640" y="446.4" text-anchor="middle"
        font-family="Playfair Display, Georgia, serif" font-style="italic"
        font-weight="500" font-size="50" fill="#15140f" letter-spacing="-0.5">
    Recommender<tspan fill="#ed6f5c">.</tspan>
  </text>
  <!-- meta: slot id -->
  <text x="640" y="518.4" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#8b8676" letter-spacing="2">
    WORK-1 · 1280×720
  </text>
  <!-- hint: research prompt -->
  <text x="640" y="561.6" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="16" fill="#8b8676" letter-spacing="0.6">
    score ring · venue fit · abstract
  </text>
</svg>