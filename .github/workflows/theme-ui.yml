name: Theme UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/theme-persistence-test.py'
      - '.github/workflows/theme-ui.yml'

jobs:
  theme-persistence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install websocket-client

      - name: Verify Chrome is available
        run: google-chrome --version

      - name: Run theme switch + persistence test
        run: python scripts/theme-persistence-test.py
