name: Backfill Historical Papers

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Start date (YYYY-MM-DD) — e.g. 2026-01-01'
        required: true
        default: '2026-01-01'
      skip_conferences:
        description: 'Skip conference connectors (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: push-to-main
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: write
    steps:
      - name: Require main branch
        env:
          PUBLICATION_REF: "${{ github.ref }}"
        run: |
          if [ "$PUBLICATION_REF" != "refs/heads/main" ]; then
            echo "This workflow publishes only from main." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill pipeline
        run: |
          SKIP_FLAG=""
          if [ "${{ github.event.inputs.skip_conferences }}" = "true" ]; then
            SKIP_FLAG="--skip-conferences"
          fi
          python src/pipeline.py --backfill-from "${{ github.event.inputs.from_date }}" $SKIP_FLAG
        env:
          PYTHONPATH: ${{ github.workspace }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

      - name: Commit backfilled data
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add site/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: backfill data from ${{ github.event.inputs.from_date }}"

          RECOVERY_DIR=publication-recovery
          GENERATED_COMMIT=$(git rev-parse HEAD)
          BASE_COMMIT=$(git rev-parse HEAD^)
          mkdir -p "$RECOVERY_DIR"
          printf '%s\n' "$GENERATED_COMMIT" > "$RECOVERY_DIR/generated_commit_sha"
          printf '%s\n' "$BASE_COMMIT" > "$RECOVERY_DIR/base_commit_sha"
          git format-patch --binary --stdout "$BASE_COMMIT..$GENERATED_COMMIT" > "$RECOVERY_DIR/generated.patch"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Generated data pushed to main."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after three attempts. Recovery files are ready for upload." >&2
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
            sleep 5
          done

      - name: Upload generated data recovery
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backfill-generated-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication-recovery/
          retention-days: 14
          if-no-files-found: ignore

      - name: Dispatch Pages deployment
        if: success() && github.repository == 'kishormorol/ResearchScope'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main --repo "$GH_REPO"
