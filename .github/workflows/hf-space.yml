name: Sync Hugging Face Space

# Mirrors the published site to https://huggingface.co/spaces/kishormorol/ResearchScope
# from the recorded source of each successful Pages deploy.
on:
  # Follow the Pages deploy, so the Space only ever gets a site that shipped.
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Never let two uploads race for the same Space; don't cancel one mid-upload.
concurrency:
  group: hf-space
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.repository == 'kishormorol/ResearchScope')
    runs-on: ubuntu-latest
    steps:
      - name: Require main source branch
        env:
          EVENT_NAME: "${{ github.event_name }}"
          GH_REPO: "${{ github.repository }}"
          PUBLICATION_REF: "${{ github.ref }}"
          WORKFLOW_RUN_HEAD_BRANCH: "${{ github.event.workflow_run.head_branch }}"
          WORKFLOW_RUN_REPOSITORY: "${{ github.event.workflow_run.repository.full_name }}"
          WORKFLOW_RUN_HEAD_REPOSITORY: "${{ github.event.workflow_run.head_repository.full_name }}"
        run: |
          if [ "$PUBLICATION_REF" != "refs/heads/main" ]; then
            echo "This workflow publishes only from main." >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_run" ] && { [ "$WORKFLOW_RUN_HEAD_BRANCH" != "main" ] || [ "$WORKFLOW_RUN_REPOSITORY" != "$GH_REPO" ] || [ "$WORKFLOW_RUN_HEAD_REPOSITORY" != "$GH_REPO" ]; }; then
            echo "The source workflow repository or branch is invalid." >&2
            exit 1
          fi

      - name: Download Pages source metadata
        id: source
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_RUN_ID: "${{ github.event.workflow_run.id }}"
          WORKFLOW_RUN_ATTEMPT: "${{ github.event.workflow_run.run_attempt }}"
        run: |
          set -euo pipefail
          if [[ ! "$WORKFLOW_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "The source workflow run ID is invalid." >&2
            exit 1
          fi
          if [[ ! "$WORKFLOW_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "The source workflow attempt is invalid." >&2
            exit 1
          fi
          source_dir="$RUNNER_TEMP/pages-source"
          mkdir -p "$source_dir"
          gh run download "$WORKFLOW_RUN_ID" --name "pages-source-$WORKFLOW_RUN_ATTEMPT" --dir "$source_dir" --repo "$GH_REPO"
          source_file="$source_dir/source-sha.txt"
          if [ ! -f "$source_file" ] || [ "$(wc -c < "$source_file")" -ne 41 ]; then
            echo "The Pages source metadata artifact is invalid." >&2
            exit 1
          fi
          IFS= read -r source_sha < "$source_file"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The Pages source SHA is invalid." >&2
            exit 1
          fi
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && steps.source.outputs.source_sha || github.sha }}

      - name: Stage the site
        run: |
          mkdir _hf
          cp -R site/. _hf/
          # Pipeline data the site never loads, and too big for a Space.
          rm -f _hf/data/{papers_db,conferences_db,journals_db,search_index}.json
          find _hf -name .DS_Store -delete

      # `secrets` is not available to a step-level `if`, so the token check
      # becomes an output. Without it a fork, or this repo before the secret is
      # set, would fail the run for a reason nobody can act on.
      - name: Check for a Hugging Face token
        id: token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HF_TOKEN is not set, so the Space was not updated."
          fi

      - uses: actions/setup-python@v5
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.12'

      - name: Install the Hugging Face client
        if: steps.token.outputs.present == 'true'
        run: pip install --quiet --upgrade huggingface_hub

      # The Space keeps its own README.md (the YAML header HF reads) and
      # .gitattributes; everything else is replaced by the staged site, and
      # files the site no longer has are deleted.
      - name: Upload to the Space
        if: steps.token.outputs.present == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: kishormorol/ResearchScope
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && steps.source.outputs.source_sha || github.sha }}
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import HfApi, hf_hub_download

          space = os.environ["SPACE"]
          for name in ("README.md", ".gitattributes"):
              shutil.copy(hf_hub_download(space, name, repo_type="space"), f"_hf/{name}")

          HfApi().upload_folder(
              repo_id=space,
              repo_type="space",
              folder_path="_hf",
              delete_patterns=["*"],
              commit_message=f"Sync from GitHub {os.environ['SOURCE_SHA'][:7]}",
          )
          PY
