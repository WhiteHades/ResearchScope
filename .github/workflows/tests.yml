name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - 'backend/requirements.txt'
      - 'backend/app/tag_aliases.json'
      - 'site/assets/js/tag-aliases.js'
      - 'scripts/build_tag_aliases.py'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt pytest

      - name: Check browser tag aliases
        run: python scripts/build_tag_aliases.py --check

      - name: Run tests
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_storage.py \
            --ignore=tests/test_analysis.py \
            --ignore=tests/test_models.py \
            -v --tb=short
