# Score weights for ResearchScope.
# All component weights within a score sum to 1.0.
# Scores are all normalised to 0–10.

# ── Paper score ("what matters") — v2 ──────────────────────────────────────
# Measures how significant / important a paper is to the field.
# v2 changes: recency cut from 0.35→0.12 to end score clustering;
#   completeness removed; citation_velocity + contribution_depth added.
paper_score:
  recency:              0.12   # exponential decay (age=0→10, age=5→3.2)
  novelty:              0.12   # phrase-level, length-normalized, max 4 signals
  quality_hint:         0.25   # source-type aware: rank+cites for conf, cites-only for preprints
  citation_velocity:    0.15   # citations/year log-normalized; rewards fast-rising papers
  contribution_depth:   0.15   # abstract structure: problem+method+eval+results+scope
  institution_prestige: 0.12   # affiliations_raw → abstract fallback
  author_prestige:      0.09   # tiered renowned-author list with ambiguity guard

# ── Read-first score ("what should I read first") — v2 ──────────────────────
read_first_score:
  clarity:          0.25   # structural indicators + word count
  abstract_quality: 0.20   # length adequacy + clarity indicators (new)
  foundational:     0.20   # foundational-concept keyword density
  accessibility:    0.20   # inverse difficulty level
  topic_centrality: 0.15   # hot-topic tag overlap

# ── Content potential score ("worth discussing publicly") — v2 ───────────────
# Practical + broad lead because they predict social shareability best.
content_potential_score:
  practical_value: 0.28   # deployment / production / real-world (narrowed regex)
  broad_relevance: 0.22   # cross-domain generalization signals
  surprise:        0.18   # counter-intuitive results (narrowed to specific phrases)
  trend_alignment: 0.18   # hot-topic tag overlap
  explainability:  0.14   # simple / intuitive / plug-and-play language

# ── Author momentum score — v2 ───────────────────────────────────────────────
author_momentum:
  recent_output:        0.25   # papers in last 2 years
  avg_quality:          0.25   # avg paper_score across all author papers
  acceleration:         0.15   # output growth vs. prior 2-year window
  topic_strength:       0.15   # hot-topic tag count in author's papers
  conference_strength:  0.10   # ratio of A / A* papers
  recent_velocity:      0.10   # avg citation velocity of recent papers (new)

# ── Lab momentum score ────────────────────────────────────────────────────────
lab_momentum:
  recent_output:       0.30
  avg_quality:         0.25
  a_star_ratio:        0.25   # proportion of A* papers
  topic_diversity:     0.10
  author_count:        0.10

# ── Conference rank → quality_hint score ────────────────────────────────────
conference_rank_scores:
  "A*": 10.0
  "A":   7.5
  "B":   5.0
  "C":   3.0
  "":    0.0

# ── Default queries for arXiv connector ─────────────────────────────────────
arxiv_queries:
  - "large language models"
  - "natural language processing"
  - "computer vision transformer"
  - "reinforcement learning"
  - "diffusion models"
  - "retrieval augmented generation"
  - "multimodal learning"
  - "code generation LLM"

# ── ACL Anthology venues to fetch (short IDs) ───────────────────────────────
acl_venues:
  - acl
  - emnlp
  - naacl
  - eacl
  - coling
  - conll
